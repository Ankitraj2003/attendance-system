name: Application CI & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Secret Detection & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets and private keys
        run: |
          echo "Scanning working tree for accidentally committed secret patterns..."
          # Check for tracked .env files
          if git ls-files | grep -E '\.env$' ; then
            echo "ERROR: Tracked .env file detected in repository!"
            exit 1
          fi

          # Check for private keys or certificates
          if git ls-files | grep -E '\.(pem|key|crt|p12|pfx)$' ; then
            echo "ERROR: Tracked certificate/key file detected in repository!"
            exit 1
          fi

          # Verify no production connection strings with real passwords in tracked files
          if git grep -inE '(postgres|postgresql)://[^:]+:[^@]+@[a-z0-9.-]+\.neon\.tech' -- ':!.env.example' ; then
            echo "ERROR: Disclosed Neon production connection string detected!"
            exit 1
          fi
          echo "Secret detection scan completed with zero findings."

  frontend-build:
    name: Frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-tests:
    name: Backend tests with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_test_db_password_123
          POSTGRES_DB: test_attendance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_attendance_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://test_user:ci_test_db_password_123@localhost:5432/test_attendance_db
      SECRET_KEY: ci-test-secret-key-minimum-32-chars-long-strictly-for-testing
      DEV_ADMIN_PASSWORD: TestAdminPass@2026!
      COMPANY_NAME: Expandit
      COMPANY_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -v
